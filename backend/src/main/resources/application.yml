spring:
  application:
    name: food-delivery
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fooddelivery}
    username: ${DB_USER:food}
    password: ${DB_PASSWORD:change_me}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:none}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-32chars!}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    access-expiration-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-expiration-days: ${JWT_REFRESH_DAYS:7}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  cookie:
    secure: ${COOKIE_SECURE:false}
  security:
    login-max-attempts: ${LOGIN_MAX_ATTEMPTS:10}
    login-window-seconds: ${LOGIN_WINDOW_SECONDS:60}
  delivery:
    base-fee: ${DELIVERY_BASE_FEE:15000}
    free-threshold: ${DELIVERY_FREE_THRESHOLD:200000}
server:
  port: 8080
  forward-headers-strategy: framework
