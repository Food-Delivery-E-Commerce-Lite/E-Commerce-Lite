spring:
  application:
    name: food-delivery
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fooddelivery}
    username: ${DB_USER:food}
    password: ${DB_PASSWORD:change_me}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:none}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-32chars!}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
server:
  port: 8080
  forward-headers-strategy: framework
