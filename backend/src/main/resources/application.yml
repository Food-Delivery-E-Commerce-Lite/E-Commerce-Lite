spring:
  application:
    name: food-delivery
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fooddelivery}
    username: ${DB_USER:food}
    password: ${DB_PASSWORD:change_me}
  jpa:
    hibernate:
      ddl-auto: none        # schema do Flyway quản lý
    open-in-view: false
  flyway:
    enabled: true
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
server:
  port: 8080
